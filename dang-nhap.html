<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | DAV Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style/all.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="page-login-dav">
    <main class="login-dav">
        <section class="login-dav__brand" aria-labelledby="login-brand-title">
            <div class="login-dav__brand-bg" aria-hidden="true">
                <img class="login-dav__brand-img" src="./assets/login-bg.png" alt="">
                <span class="login-dav__brand-gradient"></span>
                <img class="login-dav__brand-overlay" src="./assets/login-overlay.png" alt="">
            </div>

            <div class="login-dav__brand-content">
                <div class="login-dav__brand-logo">
                    <img src="./assets/login-logo.png" alt="DAV Alumni Network">
                </div>

                <div class="login-dav__brand-heading">
                    <p class="login-dav__brand-welcome">Welcome to</p>
                    <h2 class="login-dav__brand-title" id="login-brand-title">DAV Alumni Network</h2>
                </div>

                <p class="login-dav__brand-subtitle">
                    Chào mừng đến với mạng lưới Cựu sinh viên<br>
                    Học viện Ngoại giao
                </p>

                <hr class="login-dav__brand-divider">

                <p class="login-dav__brand-tagline">Kết nối - Sẻ chia - Dẫn dắt</p>
            </div>
        </section>

        <section class="login-dav__form-section">
            <form class="login-dav__form" novalidate aria-labelledby="login-title">
                <header class="login-dav__form-head">
                    <p class="login-dav__form-welcome">Chào mừng quay trở lại</p>
                    <h1 class="login-dav__form-title" id="login-title">Đăng nhập</h1>
                </header>

                <div class="login-dav__fields">
                    <div class="login-dav__field">
                        <label class="login-dav__label" for="login-username">Tên đăng nhập <span class="login-dav__req" aria-hidden="true">*</span></label>
                        <div class="login-dav__input">
                            <input id="login-username" name="username" type="text" placeholder="Tên đăng nhập" required autofocus>
                        </div>
                    </div>

                    <div class="login-dav__field">
                        <label class="login-dav__label" for="login-password">Mật khẩu <span class="login-dav__req" aria-hidden="true">*</span></label>
                        <div class="login-dav__input login-dav__input--password">
                            <input id="login-password" name="password" type="password" placeholder="Nhập mật khẩu" required>
                            <button type="button" class="login-dav__pwd-toggle" data-pwd-toggle="login-password" aria-label="Hiện/ẩn mật khẩu">
                                <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="login-dav__row">
                        <label class="login-dav__remember">
                            <input type="checkbox" name="remember">
                            <span class="login-dav__check-mark" aria-hidden="true">
                                <i class="fa-solid fa-check"></i>
                            </span>
                            <span class="login-dav__check-text">Remember me</span>
                        </label>
                        <a href="#" class="login-dav__forgot">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="login-dav__submit">Gửi thông tin</button>

                <p class="login-dav__signup">Bạn chưa có tài khoản? <a href="./dang-ky.html">Đăng ký ngay</a></p>
            </form>
        </section>
    </main>

    <script src="./js/dang-ky-form.js"></script>
</body>

</html>
