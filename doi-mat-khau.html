<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu | DAV Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style/all.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="page-knowledge-dav page-change-password-dav">
    <header class="app-topbar">
        <div class="app-topbar__left">
            <button type="button" class="app-topbar__menu" aria-label="Mở menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <a href="./index.html" class="app-topbar__brand">
                <span class="app-topbar__logo">
                    <img src="./assets/dav-form-logo.png" alt="">
                </span>
                <span class="app-topbar__brand-text">mạng lưới CỰU SINH VIÊN Học viện Ngoại giao</span>
            </a>
        </div>

        <div class="app-topbar__right">
            <button type="button" class="app-topbar__notify" aria-label="Thông báo">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                <span class="app-topbar__notify-badge" aria-label="2 thông báo chưa đọc">2</span>
            </button>

            <button type="button" class="app-topbar__user" aria-haspopup="menu">
                <span class="app-topbar__avatar">
                    <img src="./assets/user-avatar.png" alt="">
                    <span class="app-topbar__avatar-status" aria-hidden="true"></span>
                </span>
                <span class="app-topbar__user-name">Phúc Nguyễn Văn</span>
                <i class="app-topbar__user-chev fa-solid fa-caret-down" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <div class="app-shell">
        <aside class="app-sidebar" aria-label="Menu tài khoản">
            <div class="app-sidebar__profile">
                <div class="app-sidebar__avatar">
                    <img src="./assets/user-avatar-large.png" alt="Ảnh đại diện">
                    <span class="app-sidebar__verified" aria-label="Đã xác minh">
                        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    </span>
                </div>
                <p class="app-sidebar__name">Nguyễn Văn Phúc</p>
                <div class="app-sidebar__id">
                    <span class="app-sidebar__id-text">CSVKx-yyy</span>
                    <button type="button" class="app-sidebar__copy" aria-label="Sao chép mã">
                        <i class="fa-regular fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <nav class="app-sidebar__nav">
                <a href="./ho-so-ca-nhan.html" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-regular fa-user" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Hồ sơ cá nhân</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="./kien-thuc-chia-se.html" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-regular fa-bookmark" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Kiến thức chia sẻ</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="#" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-regular fa-calendar" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Sự kiện</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="./doi-mat-khau.html" class="app-sidebar__nav-item is-active" aria-current="page">
                    <i class="app-sidebar__nav-icon fa-solid fa-lock" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Đổi mật khẩu</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>

                <hr class="app-sidebar__divider">

                <a href="./dang-nhap.html" class="app-sidebar__nav-item app-sidebar__nav-item--logout">
                    <i class="app-sidebar__nav-icon fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Đăng xuất</span>
                </a>
            </nav>
        </aside>

        <main class="app-main">
            <section class="password-card" aria-labelledby="password-card-title">
                <header class="password-card__head">
                    <h1 class="password-card__title" id="password-card-title">Đổi mật khẩu</h1>
                </header>

                <form class="password-card__form" id="change-password-form" novalidate>
                    <div class="password-card__fields">
                        <div class="register-form__field">
                            <label class="register-form__label" for="cp-current">Mật khẩu hiện tại <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--password">
                                <input id="cp-current" name="current-password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                                <button type="button" class="register-form__pwd-toggle" data-pwd-toggle="cp-current" aria-label="Hiện mật khẩu">
                                    <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="cp-new">Mật khẩu mới <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--password">
                                <input id="cp-new" name="new-password" type="password" placeholder="Nhập mật khẩu mới" autocomplete="new-password" required>
                                <button type="button" class="register-form__pwd-toggle" data-pwd-toggle="cp-new" aria-label="Hiện mật khẩu">
                                    <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="cp-confirm">Xác nhận mật khẩu <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--password">
                                <input id="cp-confirm" name="confirm-password" type="password" placeholder="Xác nhận mật khẩu" autocomplete="new-password" required>
                                <button type="button" class="register-form__pwd-toggle" data-pwd-toggle="cp-confirm" aria-label="Hiện mật khẩu">
                                    <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="password-card__actions">
                        <button type="submit" class="password-card__btn password-card__btn--primary">Đổi mật khẩu</button>
                        <button type="reset" class="password-card__btn password-card__btn--ghost">Huỷ</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="./js/ho-so-ca-nhan.js"></script>
    <script src="./js/dang-ky-form.js"></script>
    <script src="./js/doi-mat-khau.js"></script>
</body>

</html>
