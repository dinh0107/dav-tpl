<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân | DAV Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style/all.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="page-profile-dav">
    <header class="app-topbar">
        <div class="app-topbar__left">
            <button type="button" class="app-topbar__menu" aria-label="Mở menu">
                <i class="fa-solid fa-grid"></i>
            </button>
            <a href="./index.html" class="app-topbar__brand">
                <span class="app-topbar__logo">
                    <img src="./assets/dav-form-logo.png" alt="">
                </span>
                <span class="app-topbar__brand-text">mạng lưới CỰU SINH VIÊN Học viện Ngoại giao</span>
            </a>
        </div>

        <div class="app-topbar__right">
            <button type="button" class="app-topbar__notify" aria-label="Thông báo">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                <span class="app-topbar__notify-badge" aria-label="2 thông báo chưa đọc">2</span>
            </button>

            <button type="button" class="app-topbar__user" aria-haspopup="menu">
                <span class="app-topbar__avatar">
                    <img src="./assets/user-avatar.png" alt="">
                    <span class="app-topbar__avatar-status" aria-hidden="true"></span>
                </span>
                <span class="app-topbar__user-name">Phúc Nguyễn Văn</span>
                <i class="app-topbar__user-chev fa-solid fa-caret-down" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <div class="app-shell">
        <aside class="app-sidebar" aria-label="Menu tài khoản">
            <div class="app-sidebar__profile">
                <div class="app-sidebar__avatar">
                    <img src="./assets/user-avatar-large.png" alt="Ảnh đại diện">
                    <span class="app-sidebar__verified" aria-label="Đã xác minh">
                        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    </span>
                </div>
                <p class="app-sidebar__name">Nguyễn Văn Phúc</p>
                <div class="app-sidebar__id">
                    <span class="app-sidebar__id-text">CSVKx-yyy</span>
                    <button type="button" class="app-sidebar__copy" aria-label="Sao chép mã">
                        <i class="fa-regular fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <nav class="app-sidebar__nav">
                <a href="./ho-so-ca-nhan.html" class="app-sidebar__nav-item is-active" aria-current="page">
                    <i class="app-sidebar__nav-icon fa-regular fa-user" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Hồ sơ cá nhân</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="#" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-etch fa-solid fa-book-open"></i>
                    <span class="app-sidebar__nav-label">Kiến thức chia sẻ</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="#" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-regular fa-calendar" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Sự kiện</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
                <a href="#" class="app-sidebar__nav-item">
                    <i class="app-sidebar__nav-icon fa-solid fa-lock" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Đổi mật khẩu</span>
                    <i class="app-sidebar__nav-chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>

                <hr class="app-sidebar__divider">

                <a href="./dang-nhap.html" class="app-sidebar__nav-item app-sidebar__nav-item--logout">
                    <i class="app-sidebar__nav-icon fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span class="app-sidebar__nav-label">Đăng xuất</span>
                </a>
            </nav>
        </aside>

        <main class="app-main">
            <section class="profile-card" aria-labelledby="profile-card-title">
                <header class="profile-card__head">
                    <h1 class="profile-card__title" id="profile-card-title">Hồ sơ cá nhân</h1>
                    <button type="button" class="profile-card__btn profile-card__btn--edit" data-profile-edit>
                        <i class="fa-solid fa-pen" aria-hidden="true"></i>
                        <span>Chỉnh sửa hồ sơ</span>
                    </button>
                </header>

                <form id="profile-form" class="profile-card__form" data-profile-form novalidate>
                    <div class="register-form__fields">
                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-name">Họ và tên <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-name" name="fullname" type="text" required disabled>
                                </div>
                            </div>
                        </div>

                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-phone">Số điện thoại <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-phone" name="phone" type="tel" value="0981753899" required disabled>
                                </div>
                            </div>
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-email">Email <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-email" name="email" type="email" value="Phucnguyen@gmail.com" required disabled>
                                </div>
                            </div>
                        </div>

                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-dob">Ngày sinh <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-dob" name="dob" type="date" required disabled>
                                </div>
                            </div>
                            <fieldset class="register-form__field register-form__field--gender">
                                <legend class="register-form__label">Giới tính <span class="register-form__req" aria-hidden="true">*</span></legend>
                                <div class="register-form__radios">
                                    <label class="register-form__radio">
                                        <input type="radio" name="gender" value="male" checked disabled>
                                        <span class="register-form__radio-mark" aria-hidden="true"></span>
                                        <span class="register-form__radio-text">Nam</span>
                                    </label>
                                    <label class="register-form__radio">
                                        <input type="radio" name="gender" value="female" disabled>
                                        <span class="register-form__radio-mark" aria-hidden="true"></span>
                                        <span class="register-form__radio-text">Nữ</span>
                                    </label>
                                    <label class="register-form__radio">
                                        <input type="radio" name="gender" value="other" disabled>
                                        <span class="register-form__radio-mark" aria-hidden="true"></span>
                                        <span class="register-form__radio-text">Khác</span>
                                    </label>
                                </div>
                            </fieldset>
                        </div>

                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-unit">Đơn vị công tác <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input register-form__input--select">
                                    <select id="pf-unit" name="unit" required disabled>
                                        <option value="" disabled selected>--Chọn--</option>
                                        <option>Khoa Quan hệ quốc tế</option>
                                        <option>Khoa Luật quốc tế</option>
                                        <option>Khoa Kinh tế quốc tế</option>
                                        <option>Khoa Truyền thông và Văn hóa đối ngoại</option>
                                    </select>
                                    <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                                </div>
                            </div>
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-position">Chức danh <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-position" name="position" type="text" placeholder="Chức danh" required disabled>
                                </div>
                            </div>
                        </div>

                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-tenure">Thời gian công tác <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input">
                                    <input id="pf-tenure" name="tenure" type="text" placeholder="2010 - nay" required disabled>
                                </div>
                            </div>
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-major">Lĩnh vực chuyên môn <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input register-form__input--select">
                                    <select id="pf-major" name="major" required disabled>
                                        <option value="" disabled selected>--Chọn--</option>
                                        <option>Quan hệ quốc tế</option>
                                        <option>Luật quốc tế</option>
                                        <option>Kinh tế đối ngoại</option>
                                        <option>Truyền thông quốc tế</option>
                                    </select>
                                    <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                                </div>
                            </div>
                        </div>

                        <div class="register-form__row">
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-status">Trạng thái công tác <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input register-form__input--select">
                                    <select id="pf-status" name="status" required disabled>
                                        <option selected>Đang công tác</option>
                                        <option>Đã nghỉ hưu</option>
                                        <option>Đã chuyển công tác</option>
                                    </select>
                                    <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                                </div>
                            </div>
                            <div class="register-form__field">
                                <label class="register-form__label" for="pf-type">Phân loại <span class="register-form__req" aria-hidden="true">*</span></label>
                                <div class="register-form__input register-form__input--select">
                                    <select id="pf-type" name="type" required disabled>
                                        <option selected>Giảng Viên</option>
                                        <option>Giảng viên thỉnh giảng</option>
                                        <option>Cán bộ hành chính</option>
                                    </select>
                                    <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="profile-card__actions" data-profile-actions hidden>
                        <button type="button" class="profile-card__btn profile-card__btn--cancel" data-profile-cancel>
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            <span>Huỷ</span>
                        </button>
                        <button type="submit" class="profile-card__btn profile-card__btn--save" data-profile-save>
                            <i class="fa-solid fa-check" aria-hidden="true"></i>
                            <span>Cập nhật</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="./js/ho-so-ca-nhan.js"></script>
</body>

</html>
