<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Doanh nghiệp &amp; Tổ chức | DAV Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style/all.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="page-register-dav">
    <main class="register-dav">
        <div class="register-dav__bg" aria-hidden="true">
            <img src="./assets/dang-ky-bg.jpg" alt="">
            <span class="register-dav__overlay"></span>
        </div>

        <form class="register-dav__card register-dav__card--form" novalidate aria-labelledby="register-form-title">
            <header class="register-form__head">
                <div class="register-form__heading">
                    <p class="register-form__welcome">Xin chào!</p>
                    <h1 class="register-form__title" id="register-form-title">Đăng ký tài khoản Doanh nghiệp &amp; Tổ chức</h1>
                </div>
                <a href="./index.html" class="register-form__logo" aria-label="DAV Alumni">
                    <img src="./assets/dav-form-logo.png" alt="">
                </a>
            </header>

            <div class="register-form__sections">
                <section class="register-form__section">
                    <h2 class="register-form__section-title">Thông tin doanh nghiệp</h2>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-org-name">Tên pháp lý Tổ chức/ Doanh nghiệp <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-org-name" name="org_name" type="text" required>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-tax">Mã số thuế <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-tax" name="tax_code" type="text" required>
                            </div>
                        </div>
                    </div>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-website">Website <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-website" name="website" type="url" required>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-license">Giấy phép kinh doanh <span class="register-form__req" aria-hidden="true">*</span></label>
                            <label class="register-form__input register-form__input--file" for="rf-license">
                                <i class="fa-solid fa-paperclip register-form__file-clip" aria-hidden="true"></i>
                                <span class="register-form__file-name" data-placeholder="Chọn tệp...">gpkd.pdf</span>
                                <i class="fa-solid fa-cloud-arrow-up register-form__file-upload" aria-hidden="true"></i>
                                <input id="rf-license" name="license" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
                            </label>
                        </div>
                    </div>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-industry">Lĩnh vực hoạt động <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-industry" name="industry" type="text" required>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-province">Tỉnh thành <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--select">
                                <select id="rf-province" name="province" required>
                                    <option value="" disabled selected>--Tỉnh thành--</option>
                                    <option>Hà Nội</option>
                                    <option>TP. Hồ Chí Minh</option>
                                    <option>Đà Nẵng</option>
                                    <option>Hải Phòng</option>
                                    <option>Cần Thơ</option>
                                </select>
                                <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-address">Địa chỉ cụ thể <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-address" name="address" type="text" required>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="register-form__section">
                    <h2 class="register-form__section-title">Thông tin người đại diện</h2>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-name">Họ và tên <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-name" name="rep_name" type="text" required>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-role">Chức vụ <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-role" name="rep_role" type="text" required>
                            </div>
                        </div>
                    </div>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-phone">Số điện thoại <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-phone" name="phone" type="tel" required>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-email">Email <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input">
                                <input id="rf-email" name="email" type="email" required>
                            </div>
                        </div>
                    </div>

                    <label class="register-form__check">
                        <input type="checkbox" name="is_alumni" data-toggle-target=".js-alumni-fields" checked>
                        <span class="register-form__check-mark" aria-hidden="true">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span class="register-form__check-text">Người đại diện là cựu sinh viên/ học viên DAV?</span>
                    </label>

                    <div class="register-form__row js-alumni-fields">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-major">Chuyên ngành <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--select">
                                <select id="rf-major" name="major">
                                    <option selected>Quan hệ quốc tế</option>
                                    <option>Luật quốc tế</option>
                                    <option>Kinh tế quốc tế</option>
                                    <option>Truyền thông và Văn hóa đối ngoại</option>
                                    <option>Ngôn ngữ Anh</option>
                                </select>
                                <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-course">Khoá học <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--select">
                                <select id="rf-course" name="course">
                                    <option value="" disabled selected>--Chọn--</option>
                                    <option>K48</option>
                                    <option>K47</option>
                                    <option>K46</option>
                                    <option>K45</option>
                                    <option>K44</option>
                                </select>
                                <i class="register-form__chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>

                    <div class="register-form__row">
                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-pass">Mật khẩu <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--password">
                                <input id="rf-pass" name="password" type="password" placeholder="Nhập mật khẩu" required>
                                <button type="button" class="register-form__pwd-toggle" data-pwd-toggle="rf-pass" aria-label="Hiện/ẩn mật khẩu">
                                    <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="register-form__field">
                            <label class="register-form__label" for="rf-pass2">Nhập lại mật khẩu <span class="register-form__req" aria-hidden="true">*</span></label>
                            <div class="register-form__input register-form__input--password">
                                <input id="rf-pass2" name="password_confirm" type="password" placeholder="Nhập mật khẩu" required>
                                <button type="button" class="register-form__pwd-toggle" data-pwd-toggle="rf-pass2" aria-label="Hiện/ẩn mật khẩu">
                                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="register-form__footer">
                <label class="register-form__check">
                    <input type="checkbox" name="agree" checked required>
                    <span class="register-form__check-mark" aria-hidden="true">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="register-form__check-text">Tôi đồng ý cung cấp và cam kết thông tin trên là chính xác</span>
                </label>

                <div class="register-form__actions">
                    <a href="./dang-nhap.html" class="register-form__btn register-form__btn--ghost">Đăng nhập</a>
                    <button type="submit" class="register-form__btn register-form__btn--primary">Đăng ký</button>
                </div>
            </div>
        </form>
    </main>

    <script src="./js/dang-ky-form.js"></script>
</body>

</html>
